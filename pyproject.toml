[project]
name = "melguard-rq3"
version = "0.0.0"
description = "MelGuard (YFI-17/RQ3): passive AST Mel-spectrogram gateway detector vs. adaptive audio-jailbreak triggers on SALMONN-13B"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
