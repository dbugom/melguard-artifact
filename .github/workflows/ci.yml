name: ci
on:
  push:
  pull_request:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps (no heavy ML stack needed for the gates)
        run: python -m pip install --upgrade pip pytest
      - name: Guardrail + NUMBER_LOCK + manifest-hash gates
        run: python -m pytest -q tests/
